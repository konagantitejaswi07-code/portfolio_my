<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tejaswi | Portfolio</title>
    <!-- FontAwesome for Professional Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0a0f1d;
            --bg-secondary: #111827;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent: #10b981; /* Emerald green for modern tech vibe */
            --accent-glow: rgba(16, 185, 129, 0.15);
            --nav-bg: rgba(10, 15, 29, 0.8);
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            font-family: var(--font-sans);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Utilities & Layout */
        .container {
            max-width: 1140px;
            margin: 0 auto;
            padding: 0 24px;
        }

        section {
            padding: 100px 0;
            border-bottom: 1px solid var(--card-border);
        }

        .section-header {
            margin-bottom: 60px;
            text-align: left;
        }

        .section-header .tag {
            font-family: var(--font-mono);
            color: var(--accent);
            font-size: 0.9rem;
            display: block;
            margin-bottom: 8px;
        }

        .section-header h2 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 48px;
            align-items: center;
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            transition: var(--transition);
            cursor: pointer;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #000;
            font-weight: 600;
            box-shadow: 0 4px 14px var(--accent-glow);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--text-main);
            border: 1px solid var(--card-border);
        }

        .btn-secondary:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: var(--text-muted);
            transform: translateY(-2px);
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 0.85rem;
        }

        /* Header / Navbar */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: var(--nav-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            border-bottom: 1px solid var(--card-border);
            transition: var(--transition);
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
        }

        .logo {
            font-family: var(--font-mono);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
        }

        .logo span {
            color: var(--accent);
        }

        .nav-links {
            display: flex;
            gap: 32px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: var(--transition);
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--accent);
        }

        .menu-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Home Section */
        #home {
            min-height: 100vh;
            display: flex;
            align-items: center;
            background: radial-gradient(circle at 90% 10%, rgba(16, 185, 129, 0.08) 0%, transparent 40%),
                        radial-gradient(circle at 10% 90%, rgba(29, 78, 216, 0.05) 0%, transparent 40%);
            padding-top: 80px;
        }

        .hero-content {
            max-width: 700px;
        }

        .hero-mono {
            font-family: var(--font-mono);
            color: var(--accent);
            font-size: 1rem;
            margin-bottom: 16px;
            display: block;
        }

        .hero-content h1 {
            font-size: 4rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -0.03em;
            margin-bottom: 16px;
        }

        .hero-title {
            font-size: 1.75rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 24px;
        }

        .hero-desc {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            max-width: 600px;
        }

        .hero-action-btns {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        /* About Section */
        .about-text p {
            color: var(--text-muted);
            margin-bottom: 20px;
            font-size: 1.05rem;
        }

        .about-meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }

        .meta-item {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 16px;
            border-radius: 8px;
        }

        .meta-item i {
            color: var(--accent);
            margin-bottom: 8px;
            font-size: 1.2rem;
        }

        .meta-item h4 {
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .meta-item p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* Education Timeline */
        .timeline {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }

        .timeline::before {
            content: '';
            position: absolute;
            top: 0;
            left: 20px;
            height: 100%;
            width: 2px;
            background-color: var(--card-border);
        }

        .timeline-item {
            position: relative;
            padding-left: 60px;
            margin-bottom: 40px;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: 11px;
            top: 6px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: var(--bg-primary);
            border: 3px solid var(--accent);
        }

        .timeline-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 24px;
            transition: var(--transition);
        }

        .timeline-card:hover {
            border-color: rgba(16, 185, 129, 0.3);
            transform: translateX(4px);
        }

        .timeline-date {
            font-family: var(--font-mono);
            color: var(--accent);
            font-size: 0.85rem;
            margin-bottom: 6px;
            display: inline-block;
        }

        .timeline-card h3 {
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        .timeline-institution {
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
        }

        /* Skills Section */
        .skills-category-title {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin: 30px 0 16px 0;
        }

        .skills-category-title:first-of-type {
            margin-top: 0;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        .skill-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 16px 20px;
